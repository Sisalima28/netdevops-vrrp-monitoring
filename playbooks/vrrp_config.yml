- name: Configuracion Automatica VRRP
  hosts: switches_L3
  gather_facts: no
  connection: network_cli

  collections:
    - cisco.ios

  tasks:

    - name: Crear VLAN
      cisco.ios.ios_config:
        lines:
          - name {{ vlan_name }}
        parents: vlan {{ vlan_id }}

    - name: Configurar SVI + VRRP
      cisco.ios.ios_config:
        lines:
          - ip address {{ ip_asignada }} {{ mascara_red }}
          - vrrp {{ vlan_id }} ip {{ vip_red }}
          - vrrp {{ vlan_id }} priority {{ prioridad }}
          - "{{ 'vrrp ' + vlan_id|string + ' preempt' if preempt else 'no vrrp ' + vlan_id|string + ' preempt' }}"

        parents: interface Vlan{{ vlan_id }}
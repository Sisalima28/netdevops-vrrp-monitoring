[routers]
R1 ansible_host=10.255.255.xxx ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa'

[switches_L3]
L3SW1 ansible_host=10.255.255.xxx ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o MACs=+hmac-sha1'
L3SW2 ansible_host=10.255.255.xxx ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o MACs=+hmac-sha1'

[switches_L2]
SW1 ansible_host=192.168.xxx.xxx ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o MACs=+hmac-sha1'
SW2 ansible_host=192.168.xxx.xxx ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o MACs=+hmac-sha1'

[all:vars]
ansible_user=<user>
ansible_password=<password>
ansible_connection=network_cli
ansible_network_os=ios